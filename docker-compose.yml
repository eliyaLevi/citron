services:
  postgres:
    image: postgres:16-alpine
    container_name: citron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: citron
      POSTGRES_PASSWORD: citron_password
      POSTGRES_DB: citron
    ports:
      - "5432:5432"
    volumes:
      - citron-postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: citron-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@citron.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  citron-postgres-data:
